user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# Cấu hình TCP Load Balancing cho MQTT
stream {
    # 1. Upstream cho luồng không mã hóa (cổng 1883)
    upstream emqx_cluster {
        # Thuật toán mặc định là Round Robin (chia đều lần lượt)
        server emqx1:1883;
        server emqx2:1883;
        server emqx3:1883;
    }

    # 2. Upstream cho luồng bảo mật MQTTS/TLS (cổng 8883)
    upstream emqx_cluster_ssl {
        server emqx1:8883;
        server emqx2:8883;
        server emqx3:8883;
    }

    # Server lắng nghe và định tuyến cổng 1883 (TCP thường)
    server {
        listen 1883;
        proxy_pass emqx_cluster;
        # Tùy chọn giữ kết nối ổn định cho IoT
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Server lắng nghe và định tuyến cổng 8883 (MQTTS/TLS Passthrough)
    server {
        listen 8883;
        proxy_pass emqx_cluster_ssl;
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }
}